# GitHub Pages (Jekyll) — renders README.md as an indexable HTML page with
# proper <title>, meta description and Open Graph tags via jekyll-seo-tag.
title: git why
tagline: put the why in version control
description: >-
  A Git subcommand that records why each commit exists — as native git trailers,
  so the reasoning survives clone and push and shows up in git log. Built for
  AI-assisted development.
theme: jekyll-theme-cayman

# Google Search Console: use a URL-prefix property for https://maledadams.github.io/git-why/
# then paste the "HTML tag" token here (jekyll-seo-tag emits the meta tag) and push.
# google_site_verification: PASTE_TOKEN_HERE
url: https://maledadams.github.io
baseurl: /git-why
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
